<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 20 · Thai Green Curry with Fish</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--text:#2a2420;--muted:#7a6f66;--accent:#b3261e;--green:#2f5d3a;--line:#e8dfd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#27221f;--text:#f3ece4;--muted:#b0a498;--accent:#ef8a80;--green:#8fc79b;--line:#3a332e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#27221f;--text:#f3ece4;--muted:#b0a498;--accent:#ef8a80;--green:#8fc79b;--line:#3a332e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.tag{font:600 12px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:2rem;margin:.4rem 0 .2rem;line-height:1.15}
.sub{color:var(--muted);margin:0 0 1rem}
.meta{display:flex;gap:16px;font:14px system-ui,sans-serif;color:var(--muted);margin-bottom:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font:600 12px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin:14px 0 6px}
.srv{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:system-ui,sans-serif}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:20px;cursor:pointer}
.stepper input{width:64px;height:40px;text-align:center;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
ul{list-style:none;margin:0;padding:0}
li.ing{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
li.ing:last-child{border:0}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
ol{list-style:none;counter-reset:s;margin:0;padding:0}
ol li{counter-increment:s;position:relative;padding:0 0 16px 44px}
ol li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:700 14px/30px system-ui,sans-serif;text-align:center}
ol li p{margin:0}
.note{font:13px system-ui,sans-serif;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="tag" id="tag"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
  <section class="srv">
    <strong id="lbl">Servings</strong>
    <div class="stepper">
      <button id="minus" aria-label="Decrease">−</button>
      <input id="n" type="number" min="1" max="200" inputmode="numeric">
      <button id="plus" aria-label="Increase">+</button>
    </div>
  </section>
  <section><h2>Ingredients</h2><div id="ings"></div><p class="note" id="scalenote"></p></section>
  <section><h2>Method</h2><ol id="steps"></ol></section>
  <p class="note" id="foot"></p>
</main>
<script>
var R={"tag": "Day 20 · Thai", "title": "Thai Green Curry with Fish", "sub": "A fragrant, creamy green curry with tender fish, sweet pumpkin and crunchy vegetables, finished with fresh basil.", "meta": ["Prep 20 min", "Cook 30 min"], "label": "Servings", "base": 4, "step": 2, "groups": [["Curry base", [["Thai green curry paste or green curry sauce, from Go Asia", 3, "tbsp"], ["Light coconut milk (leichte Kokosmilch, fettarm)", 400, "ml"], ["Water", 150, "ml"], ["Neutral oil", 1, "tbsp"], ["Fish sauce (Fischsauce)", 1, "tbsp"], ["Sugar, ideally palm sugar or brown sugar", 1, "tbsp"]]], ["Fish", [["Firm white fish fillet, fresh or frozen, such as Alaska Seelachs (pollock) or Kabeljau (cod), cut into 4 cm chunks", 400, "g"], ["Fish balls (Fischbällchen) or shrimp paste balls, from an Asian store (optional)", 200, "g"]]], ["Vegetables", [["Hokkaido pumpkin (Hokkaido-Kürbis), unpeeled, cut into 3 cm chunks", 250, "g"], ["Green beans (grüne Bohnen), cut into 4 cm lengths", 150, "g"], ["Red bell pepper (Paprika), cut into strips", 150, "g"], ["Canned bamboo shoots (Bambussprossen), drained (optional)", 100, "g"]]], ["To finish", [["Thai basil leaves", 20, "g"], ["Lime juice (Limettensaft)", 1, "tbsp"]]]], "steps": ["If the fish is frozen, let it thaw overnight in the fridge on a plate. Cut it into 4 cm chunks and put them in a sieve in the sink. Pour a kettle of boiling water over the fish and leave it for 30 seconds, until the outside turns pale. Rinse the pieces under cold water, then pat them dry with paper towels. This removes much of the fishy smell, which is especially helpful for frozen fish.", "Cut the pumpkin into 3 cm chunks (the skin of a Hokkaido pumpkin is edible, so there is no need to peel it), the green beans into 4 cm lengths, and the bell pepper into strips. Shake the can of coconut milk well, open it, and measure out 3 tablespoons into a small cup.", "Heat the oil in a wide pot over medium heat. Add the curry paste and the 3 tablespoons of coconut milk, and fry for 2–3 minutes, stirring constantly, until it smells strongly and a little green oil separates around the edges. If you use a sauce rather than a paste, fry it the same way, until it smells fragrant and has darkened slightly.", "Pour in the rest of the coconut milk and the water, and stir until smooth. Add the fish sauce and sugar, and bring to a gentle simmer.", "Add the pumpkin, green beans and bamboo shoots (if using). Simmer, partly covered, for 10–12 minutes, until a fork slides easily into the pumpkin but the pieces still hold their shape, and the beans are tender but still slightly crisp. Add the bell pepper and simmer for another 2 minutes, until hot but still with some bite. Skim off any oil that floats on the surface with a spoon.", "Gently lay the fish chunks and the fish balls on top of the curry and push them down into the sauce. Simmer very gently for 4–5 minutes, without stirring, until the fish is opaque all the way through and flakes when pressed, and the fish balls are hot all the way through and float on the surface. Stirring will break up the fish.", "Turn off the heat. Gently fold in the basil and lime juice, until the basil has just wilted. Taste, and add a splash of fish sauce if it needs salt, or a little more sugar if it needs sweetness. Serve hot over jasmine rice."], "foot": "Base amounts are for 4 servings. Green curry paste is quite hot, so start with 3 tablespoons for a mild curry, and add more if you like it spicier. If your pack says to use a lot more coconut milk, follow the pack, but you can use light coconut milk and keep the total liquid to about 550 ml to avoid a greasy sauce. Zucchini can replace the pumpkin, and salmon or large prawns can replace the white fish.", "scalenote": "For more than 8 servings, use a very large pot, and add the fish in a single layer."};
function fmt(x){
  if(x>=10) return String(Math.round(x));
  var r=Math.round(x*4)/4,w=Math.floor(r),f=r-w,fr={0:"",0.25:"¼",0.5:"½",0.75:"¾"}[f];
  if(w===0&&fr==="") return "a pinch";
  return (w?w:"")+fr;
}
function amt(v,u){
  if(u==="g") return v>=1000?(Math.round(v/10)/100)+" kg":Math.round(v)+" g";
  if(u==="ml") return v>=1000?(Math.round(v/10)/100)+" L":Math.round(v/5)*5+" ml";
  if(u==="tbsp") return v>=8?(Math.round(v/16*4)/4)+" cup":fmt(v)+" tbsp";
  if(u==="tsp") return v>=3?fmt(v/3)+" tbsp":fmt(v)+" tsp";
  if(u==="piece") return String(Math.max(1,Math.round(v)));
  if(u==="cup") return fmt(v)+(v>1?" cups":" cup");
  return fmt(v)+" "+u;
}
var $=function(i){return document.getElementById(i)};
$("tag").textContent=R.tag;$("title").textContent=R.title;$("sub").textContent=R.sub;
$("meta").innerHTML=R.meta.map(function(m){return "<span>"+m+"</span>"}).join("");
$("lbl").textContent=R.label;$("n").value=R.base;
$("steps").innerHTML=R.steps.map(function(s){return "<li><p>"+s+"</p></li>"}).join("");
$("foot").textContent=R.foot||"";
function render(){
  var n=parseInt($("n").value,10);if(!n||n<1)n=1;if(n>200)n=200;
  var k=n/R.base;
  $("ings").innerHTML=R.groups.map(function(g){
    return "<h3>"+g[0]+"</h3><ul>"+g[1].map(function(i){
      return '<li class="ing"><span>'+i[0]+'</span><span class="amt">'+amt(i[1]*k,i[2])+"</span></li>"}).join("")+"</ul>";
  }).join("");
  $("scalenote").textContent=(R.scalenote&&n>R.base)?R.scalenote:"";
}
$("minus").onclick=function(){$("n").value=Math.max(1,(parseInt($("n").value,10)||R.base)-R.step);render()};
$("plus").onclick=function(){$("n").value=Math.min(200,(parseInt($("n").value,10)||R.base)+R.step);render()};
$("n").oninput=render;render();
</script>
</body>
</html>
