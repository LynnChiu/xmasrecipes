<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 19 · Tomato Red-Braised Beef Brisket</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--text:#2a2420;--muted:#7a6f66;--accent:#b3261e;--green:#2f5d3a;--line:#e8dfd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#27221f;--text:#f3ece4;--muted:#b0a498;--accent:#ef8a80;--green:#8fc79b;--line:#3a332e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#27221f;--text:#f3ece4;--muted:#b0a498;--accent:#ef8a80;--green:#8fc79b;--line:#3a332e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.tag{font:600 12px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:2rem;margin:.4rem 0 .2rem;line-height:1.15}
.sub{color:var(--muted);margin:0 0 1rem}
.meta{display:flex;gap:16px;font:14px system-ui,sans-serif;color:var(--muted);margin-bottom:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font:600 12px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin:14px 0 6px}
.srv{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:system-ui,sans-serif}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:20px;cursor:pointer}
.stepper input{width:64px;height:40px;text-align:center;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
ul{list-style:none;margin:0;padding:0}
li.ing{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
li.ing:last-child{border:0}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
ol{list-style:none;counter-reset:s;margin:0;padding:0}
ol li{counter-increment:s;position:relative;padding:0 0 16px 44px}
ol li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:700 14px/30px system-ui,sans-serif;text-align:center}
ol li p{margin:0}
.note{font:13px system-ui,sans-serif;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="tag" id="tag"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
  <section class="srv">
    <strong id="lbl">Servings</strong>
    <div class="stepper">
      <button id="minus" aria-label="Decrease">−</button>
      <input id="n" type="number" min="1" max="200" inputmode="numeric">
      <button id="plus" aria-label="Increase">+</button>
    </div>
  </section>
  <section><h2>Ingredients</h2><div id="ings"></div><p class="note" id="scalenote"></p></section>
  <section><h2>Method</h2><ol id="steps"></ol></section>
  <p class="note" id="foot"></p>
</main>
<script>
var R={"tag": "Day 19 · Taiwanese", "title": "Tomato Red-Braised Beef Brisket", "sub": "Beef simmered until fall-apart tender in a rich, sweet and tangy sauce made from lots of tomatoes, ginger, garlic and scallions.", "meta": ["Prep 25 min", "Cook about 3 hours"], "label": "Servings", "base": 4, "step": 2, "groups": [["Beef", [["Beef brisket (Rinderbrust) or bone-in beef shank (Rinderbeinscheibe), cut into 4–5 cm chunks", 800, "g"]]], ["Aromatics", [["Ginger, sliced", 30, "g"], ["Garlic cloves, smashed", 5, "piece"], ["Spring onions (Frühlingszwiebeln), white parts in 5 cm lengths, green parts sliced for serving", 3, "piece"], ["Red chili (optional, skip it if you don’t want it spicy)", 1, "piece"], ["Lu bao braising spice packet (滷包), from Go Asia", 1, "piece"]]], ["Tomato base", [["Ripe tomatoes (Tomaten), halved, first batch", 600, "g"], ["Tomato paste (Tomatenmark)", 3, "tbsp"], ["Tomatoes, halved, second batch for the end", 400, "g"], ["Neutral oil", 2, "tbsp"]]], ["Braising liquid", [["Soy sauce", 4, "tbsp"], ["Oyster sauce", 2, "tbsp"], ["Rice wine", 4, "tbsp"], ["Sugar", 2, "tbsp"], ["Hot water", 800, "ml"], ["Black pepper", 0.5, "tsp"]]]], "steps": ["Put the beef in a large pot, cover it with cold water, and add 3 slices of the ginger and the white parts of 1 spring onion. Bring to a boil and boil for 5 minutes, until grey foam and scum rise to the surface. Drain the beef in a colander and rinse it under running water to wash off the scum. Wash out the pot.", "Halve all the tomatoes. Slice the ginger and smash the garlic. Cut the white parts of the spring onions into 5 cm lengths, and slice the green parts thinly for serving.", "Heat the oil in the clean pot over medium heat. Add the ginger, garlic, spring onion whites and the chili (if using), and fry for 1–2 minutes, until fragrant. Add the beef and stir-fry for 3–4 minutes, until it is lightly browned and the pieces are sizzling. Pour the rice wine around the edge of the pot and stir for about 1 minute, until the smell of alcohol is gone.", "Add the first batch of tomatoes (600 g) and cook for 10–12 minutes, stirring and pressing them against the pot, until they have collapsed, released all their juice and turned into a thick, jammy sauce.", "Add the tomato paste and fry for 3–4 minutes, stirring constantly, until the color deepens to a dark brick red and red oil appears around the edges. This step gives the sauce its deep flavor and color.", "Add the soy sauce, oyster sauce, sugar, hot water and the lu bao spice packet. The liquid should nearly cover the beef. Bring to a boil and skim off any foam. Turn the heat to low, partly cover the pot, and simmer for 2–2½ hours (for bone-in shank, 2½–3 hours), stirring every 20–30 minutes, until a piece of beef splits apart easily when you press it with a spoon. If the liquid falls below the top of the beef, add some hot water. Take the spice packet out after about 1 hour so the spices don’t turn bitter, unless your packet says otherwise. There is no pressure cooker here, so the long, gentle simmer is what makes the meat tender.", "Add the second batch of tomatoes (400 g) and the black pepper 30 minutes before the beef is done. They will soften into the sauce but still taste fresh.", "Take off the lid, turn the heat to medium-high, and boil for 8–12 minutes, stirring often, until the sauce is thick and glossy and coats the beef. Taste, and add a little more sugar if it is too sour or a pinch of salt if it needs it. Scatter the spring onion greens over the top, and serve hot over rice."], "foot": "Base amounts are for 4 servings. The stew tastes even better the next day, and keeps well in the fridge for 3–4 days. Bone-in shank has more flavor and gelatin, while brisket is fattier and more tender.", "scalenote": "For more than 8 servings, use a very large pot. The beef still needs the same simmering time."};
function fmt(x){
  if(x>=10) return String(Math.round(x));
  var r=Math.round(x*4)/4,w=Math.floor(r),f=r-w,fr={0:"",0.25:"¼",0.5:"½",0.75:"¾"}[f];
  if(w===0&&fr==="") return "a pinch";
  return (w?w:"")+fr;
}
function amt(v,u){
  if(u==="g") return v>=1000?(Math.round(v/10)/100)+" kg":Math.round(v)+" g";
  if(u==="ml") return v>=1000?(Math.round(v/10)/100)+" L":Math.round(v/5)*5+" ml";
  if(u==="tbsp") return v>=8?(Math.round(v/16*4)/4)+" cup":fmt(v)+" tbsp";
  if(u==="tsp") return v>=3?fmt(v/3)+" tbsp":fmt(v)+" tsp";
  if(u==="piece") return String(Math.max(1,Math.round(v)));
  if(u==="cup") return fmt(v)+(v>1?" cups":" cup");
  return fmt(v)+" "+u;
}
var $=function(i){return document.getElementById(i)};
$("tag").textContent=R.tag;$("title").textContent=R.title;$("sub").textContent=R.sub;
$("meta").innerHTML=R.meta.map(function(m){return "<span>"+m+"</span>"}).join("");
$("lbl").textContent=R.label;$("n").value=R.base;
$("steps").innerHTML=R.steps.map(function(s){return "<li><p>"+s+"</p></li>"}).join("");
$("foot").textContent=R.foot||"";
function render(){
  var n=parseInt($("n").value,10);if(!n||n<1)n=1;if(n>200)n=200;
  var k=n/R.base;
  $("ings").innerHTML=R.groups.map(function(g){
    return "<h3>"+g[0]+"</h3><ul>"+g[1].map(function(i){
      return '<li class="ing"><span>'+i[0]+'</span><span class="amt">'+amt(i[1]*k,i[2])+"</span></li>"}).join("")+"</ul>";
  }).join("");
  $("scalenote").textContent=(R.scalenote&&n>R.base)?R.scalenote:"";
}
$("minus").onclick=function(){$("n").value=Math.max(1,(parseInt($("n").value,10)||R.base)-R.step);render()};
$("plus").onclick=function(){$("n").value=Math.min(200,(parseInt($("n").value,10)||R.base)+R.step);render()};
$("n").oninput=render;render();
</script>
</body>
</html>
