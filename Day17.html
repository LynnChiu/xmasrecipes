<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 17 · Sukiyaki-Style Beef and Potatoes</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--text:#2a2420;--muted:#7a6f66;--accent:#b3261e;--green:#2f5d3a;--line:#e8dfd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#27221f;--text:#f3ece4;--muted:#b0a498;--accent:#ef8a80;--green:#8fc79b;--line:#3a332e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#27221f;--text:#f3ece4;--muted:#b0a498;--accent:#ef8a80;--green:#8fc79b;--line:#3a332e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.tag{font:600 12px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-size:2rem;margin:.4rem 0 .2rem;line-height:1.15}
.sub{color:var(--muted);margin:0 0 1rem}
.meta{display:flex;gap:16px;font:14px system-ui,sans-serif;color:var(--muted);margin-bottom:18px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font:600 12px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin:14px 0 6px}
.srv{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:system-ui,sans-serif}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:20px;cursor:pointer}
.stepper input{width:64px;height:40px;text-align:center;font-size:18px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
ul{list-style:none;margin:0;padding:0}
li.ing{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line)}
li.ing:last-child{border:0}
.amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
ol{list-style:none;counter-reset:s;margin:0;padding:0}
ol li{counter-increment:s;position:relative;padding:0 0 16px 44px}
ol li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:700 14px/30px system-ui,sans-serif;text-align:center}
ol li p{margin:0}
.note{font:13px system-ui,sans-serif;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="tag" id="tag"></div>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
  <section class="srv">
    <strong id="lbl">Servings</strong>
    <div class="stepper">
      <button id="minus" aria-label="Decrease">−</button>
      <input id="n" type="number" min="1" max="200" inputmode="numeric">
      <button id="plus" aria-label="Increase">+</button>
    </div>
  </section>
  <section><h2>Ingredients</h2><div id="ings"></div><p class="note" id="scalenote"></p></section>
  <section><h2>Method</h2><ol id="steps"></ol></section>
  <p class="note" id="foot"></p>
</main>
<script>
var R={"tag": "Day 17 · Japanese", "title": "Sukiyaki-Style Beef and Potatoes", "sub": "Tender beef strips and soft potatoes simmered in a sweet and savory sukiyaki sauce, great over hot rice.", "meta": ["Prep 20 min", "Cook 25 min"], "label": "Servings", "base": 4, "step": 2, "groups": [["Main", [["Beef steak (Rumpsteak, Hüftsteak or roast beef), sliced against the grain into thin strips", 400, "g"], ["Waxy potatoes (festkochende Kartoffeln), peeled and cut into 3 cm chunks", 500, "g"], ["Yellow onion, cut into 1 cm wedges", 200, "g"]]], ["Sukiyaki sauce", [["Soy sauce", 5, "tbsp"], ["Mirin", 5, "tbsp"], ["Rice wine or sake (optional, adds depth)", 3, "tbsp"], ["Sugar", 2, "tbsp"], ["Water", 300, "ml"]]]], "steps": ["Peel the potatoes and cut them into 3 cm chunks. Cut the onion into wedges about 1 cm thick. Slice the beef against the grain into strips about 5 mm thick and 5 cm long. Stir the soy sauce, mirin, rice wine, sugar and water together in a bowl until the sugar has dissolved.", "Put the potatoes, onion and sauce in a wide pot with a lid. Bring to a boil over medium-high heat, then turn the heat down to medium-low, cover, and simmer for 12–15 minutes, stirring now and then, until a fork slides easily into the potatoes but the chunks still hold their shape.", "Turn the heat up to medium. Spread the beef strips over the top and push them down into the sauce. Cook for 1–2 minutes, stirring gently, only until the beef is no longer red on the outside. Turn off the heat right away, because thin beef overcooks very quickly and becomes tough.", "Put the lid on and let everything sit for 5 minutes, so the potatoes can soak up the flavor. Taste the sauce. If it is too thin, lift out the beef with a slotted spoon, boil the sauce for 2–3 minutes until it has reduced by about a third, and then put the beef back in.", "Serve hot over rice, with plenty of the sauce spooned over the top."], "foot": "Base amounts are for 4 servings. Very thin beef slices, such as those sold for hot pot, work especially well, and can also be ordered from a butcher, who can slice it on the machine. Cut by hand, strips need only a bit more time.", "scalenote": "For more than 8 servings, use a very large pot. Add the beef at the very end."};
function fmt(x){
  if(x>=10) return String(Math.round(x));
  var r=Math.round(x*4)/4,w=Math.floor(r),f=r-w,fr={0:"",0.25:"¼",0.5:"½",0.75:"¾"}[f];
  if(w===0&&fr==="") return "a pinch";
  return (w?w:"")+fr;
}
function amt(v,u){
  if(u==="g") return v>=1000?(Math.round(v/10)/100)+" kg":Math.round(v)+" g";
  if(u==="ml") return v>=1000?(Math.round(v/10)/100)+" L":Math.round(v/5)*5+" ml";
  if(u==="tbsp") return v>=8?(Math.round(v/16*4)/4)+" cup":fmt(v)+" tbsp";
  if(u==="tsp") return v>=3?fmt(v/3)+" tbsp":fmt(v)+" tsp";
  if(u==="piece") return String(Math.max(1,Math.round(v)));
  if(u==="cup") return fmt(v)+(v>1?" cups":" cup");
  return fmt(v)+" "+u;
}
var $=function(i){return document.getElementById(i)};
$("tag").textContent=R.tag;$("title").textContent=R.title;$("sub").textContent=R.sub;
$("meta").innerHTML=R.meta.map(function(m){return "<span>"+m+"</span>"}).join("");
$("lbl").textContent=R.label;$("n").value=R.base;
$("steps").innerHTML=R.steps.map(function(s){return "<li><p>"+s+"</p></li>"}).join("");
$("foot").textContent=R.foot||"";
function render(){
  var n=parseInt($("n").value,10);if(!n||n<1)n=1;if(n>200)n=200;
  var k=n/R.base;
  $("ings").innerHTML=R.groups.map(function(g){
    return "<h3>"+g[0]+"</h3><ul>"+g[1].map(function(i){
      return '<li class="ing"><span>'+i[0]+'</span><span class="amt">'+amt(i[1]*k,i[2])+"</span></li>"}).join("")+"</ul>";
  }).join("");
  $("scalenote").textContent=(R.scalenote&&n>R.base)?R.scalenote:"";
}
$("minus").onclick=function(){$("n").value=Math.max(1,(parseInt($("n").value,10)||R.base)-R.step);render()};
$("plus").onclick=function(){$("n").value=Math.min(200,(parseInt($("n").value,10)||R.base)+R.step);render()};
$("n").oninput=render;render();
</script>
</body>
</html>
